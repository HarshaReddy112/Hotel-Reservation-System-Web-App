<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Manager</title>
  <style>
    body {
      margin: 0;
	  background-image: url('bluebg.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75); /* 75% dark overlay */
      z-index: -1;
    }

    h1 {
      font-family: "Brush Script MT", cursive;
	  font-weight: 100;
      font-size: 2.5em;
      color: #f5f5f5;
      margin-bottom: 20px;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.7);
    }

    form {
      background: linear-gradient(145deg, #1c1c1c, #232323);
	  opacity: 0.8;
      transition: opacity 0.3s ease-in-out;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      width: 320px;
    }

    h2 {
      margin-bottom: 25px;
      font-size: 1.6em;
      color: #90caf9;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: none;
      border-radius: 8px;
      background: #2c2c2c;
      color: #fff;
      font-size: 1em;
    }

    input::placeholder {
      color: #aaa;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #1e88e5;
      color: white;
      font-size: 1em;
      border: none;
      border-radius: 8px;
      margin-top: 15px;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.2s ease;
    }

    button:hover {
      background: #1565c0;
      transform: scale(1.02);
    }

    button:active {
      transform: scale(0.98);
    }

    @media (max-width: 400px) {
      form {
        width: 90%;
        padding: 30px;
      }
    }
  </style>
</head>
<body>
  <h1>IFC Hotels</h1>

  <form id="loginForm">
    <h2>Manager Portal</h2>
    <input type="text" id="user_id" placeholder="Username" required />
    <input type="password" id="password" placeholder="Password" required />
    <button type="submit">Login</button>
  </form>

  <script>
   async function loginUser(user_id, password) {
      try {
        const response = await fetch("http://localhost:5000/loginm", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            user_id: user_id,
            password: password
          })
        });

        if (!response.ok) throw new Error("Network response was not OK");

        const data = await response.json();

        if (data.success) {
          alert("Login successful!");
          // Store username and userID in localStorage
          localStorage.setItem("user_id", user_id);
          if (data.manager_id) {
            localStorage.setItem("manager_id", data.manager_id);
          }
          window.location.href = "manager_catalog.html";
        } else {
          alert("Login failed: " + data.message);
        }
      } catch (error) {
        console.error("Error:", error);
        alert("An error occurred while logging in.");
      }
    }

    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const user_id = document.getElementById("user_id").value;
      const password = document.getElementById("password").value;
      loginUser(user_id, password);
    });
  </script>
</body>

</body>
</html>
