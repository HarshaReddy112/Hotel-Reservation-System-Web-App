<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Hotel Reservation</title>
  <style>
    :root {
      --bg: #07111f;
      --panel: rgba(7, 17, 31, 0.84);
      --text: #f7f4ef;
      --muted: #c7d2e0;
      --accent: #ffb84d;
      --accent-2: #d65b5b;
      --border: rgba(255,255,255,0.16);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, rgba(7,17,31,0.88), rgba(17,36,71,0.82)), url('/static/homepage.jpg') center/cover fixed;
      padding: 20px;
    }

    .login-shell {
      width: min(440px, 100%);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 28px;
      backdrop-filter: blur(12px);
      box-shadow: 0 18px 45px rgba(0,0,0,0.25);
    }

    .eyebrow {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      color: #f5d8a8;
      font-size: 0.78rem;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: .2em;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.7rem, 3vw, 2.3rem);
      line-height: 1.15;
    }

    .subtext {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.6;
    }

    form {
      display: grid;
      gap: 12px;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #101a2e;
      color: var(--text);
      font-size: 1rem;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 12px 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: white;
      font-weight: 700;
      cursor: pointer;
      margin-top: 4px;
    }

    button:hover { transform: translateY(-2px); }
  </style>
</head>
<body>
  <div class="login-shell">
    <div class="eyebrow">IFC Hotels</div>
    <h1>Welcome back to your luxury stay</h1>
    <p class="subtext">Sign in to browse premium suites, compare room experiences, and complete your reservation in minutes.</p>

    <form id="loginForm">
      <input type="text" id="username" placeholder="Username" required />
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit">Login</button>
    </form>
  </div>

  <script>
   async function loginUser(username, password) {
      try {
        const response = await fetch("/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ Name: username, Password: password })
        });

        if (!response.ok) throw new Error("Network response was not OK");

        const data = await response.json();

        if (data.success) {
          localStorage.setItem("username", username);
          if (data.userID) {
            localStorage.setItem("userID", data.userID);
          }
          window.location.href = "/catalog";
        } else {
          alert("Login failed: " + data.message);
        }
      } catch (error) {
        console.error("Error:", error);
        alert("An error occurred while logging in.");
      }
    }

    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      loginUser(username, password);
    });
  </script>
</body>
</html>
