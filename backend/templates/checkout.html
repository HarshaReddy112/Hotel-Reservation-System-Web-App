<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout - Hotel Booking</title>
  <style>
    :root {
      --bg: #f7f3ef;
      --panel: #fffdfa;
      --text: #222222;
      --muted: #6f7282;
      --accent: #ff5a5f;
      --accent-2: #ff385c;
      --border: #ece5de;
      --shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: linear-gradient(135deg, #fff8f0 0%, #fefcf8 100%);
    }

    .checkout-card {
      width: min(760px, 100%);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 28px;
      box-shadow: var(--shadow);
    }

    h1 { margin: 0 0 10px; font-size: clamp(1.8rem, 3vw, 2.3rem); }
    .subtext { color: var(--muted); margin-bottom: 16px; line-height: 1.6; }
    .summary-list { display: grid; gap: 10px; margin-top: 12px; }
    .summary-item {
      display: flex; justify-content: space-between; gap: 12px; padding: 12px 14px; border-radius: 14px;
      background: #fff5ee;
      border: 1px solid var(--border);
    }

    .summary-item strong { color: #ff5a5f; }
    button {
      width: 100%; margin-top: 18px; border: none; border-radius: 12px; padding: 12px 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: white; cursor: pointer; font-weight: 700;
      box-shadow: 0 8px 18px rgba(255,90,95,0.16);
    }
    button:hover { transform: translateY(-1px); }
    .warning { display: none; color: #c94b3d; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="checkout-card">
    <h1>Booking summary</h1>
    <p class="subtext">Your selected room is almost ready. Review the details and confirm your stay.</p>

    <div class="summary-list">
      <div class="summary-item"><strong>Hotel</strong><span id="hotel">...</span></div>
      <div class="summary-item"><strong>Room</strong><span id="room">...</span></div>
      <div class="summary-item"><strong>Check-in</strong><span id="checkin">...</span></div>
      <div class="summary-item"><strong>Check-out</strong><span id="checkout">...</span></div>
      <div class="summary-item"><strong>Offer</strong><span id="offerName">None</span></div>
      <div class="summary-item"><strong>Discount</strong><span id="discount">₹0</span></div>
      <div class="summary-item"><strong>Pre-tax total</strong><span id="preTax">...</span></div>
      <div class="summary-item"><strong>Tax (18%)</strong><span id="taxAmount">...</span></div>
      <div class="summary-item"><strong>Final total</strong><span id="price">...</span></div>
    </div>

    <button onclick="confirmBooking()">Proceed to Payment</button>
    <div id="warning" class="warning">Some booking details are missing. Please complete the process.</div>
  </div>

  <script>
    const hotel = localStorage.getItem('selectedHotel');
    const room = localStorage.getItem('selectedRoom');
    const checkin = localStorage.getItem('checkinDate');
    const checkout = localStorage.getItem('checkoutDate');
    const selectedOfferTitle = localStorage.getItem('selectedOfferTitle');
    const offerDiscount = parseFloat(localStorage.getItem('selectedOfferDiscount')) || 0;
    const userID = localStorage.getItem('userID');

    const selectedRoomNumber = room ? parseInt(room, 10) : null;
    const roomPrice = localStorage.getItem('roomPrice') ? parseFloat(localStorage.getItem('roomPrice')) : null;
    const priceFromStorage = localStorage.getItem('price');

    document.getElementById('hotel').textContent = hotel || 'N/A';
    document.getElementById('room').textContent = room || 'N/A';
    document.getElementById('checkin').textContent = checkin || 'N/A';
    document.getElementById('checkout').textContent = checkout || 'N/A';
    document.getElementById('offerName').textContent = selectedOfferTitle || 'None';
    document.getElementById('discount').textContent = offerDiscount > 0 ? `${Math.round(offerDiscount * 100)}% off` : 'None';

    if (checkin && checkout && selectedRoomNumber && priceFromStorage) {
      const checkinDate = new Date(checkin);
      const checkoutDate = new Date(checkout);
      const numNights = Math.max(1, (checkoutDate - checkinDate) / (1000 * 60 * 60 * 24));
      const baseRate = roomPrice || 0;
      const baseTotal = baseRate * numNights;
      const discounted = baseTotal * (1 - offerDiscount);
      const taxAmount = discounted * 0.18;
      const finalTotal = discounted + taxAmount;

      document.getElementById('preTax').textContent = discounted ? `₹${discounted.toFixed(2)}` : 'N/A';
      document.getElementById('taxAmount').textContent = discounted ? `₹${taxAmount.toFixed(2)}` : 'N/A';
      document.getElementById('price').textContent = finalTotal ? `₹${finalTotal.toFixed(2)}` : 'N/A';
      localStorage.setItem('price', finalTotal.toFixed(2));
    } else {
      document.getElementById('preTax').textContent = 'N/A';
      document.getElementById('taxAmount').textContent = 'N/A';
      document.getElementById('price').textContent = priceFromStorage ? `₹${parseFloat(priceFromStorage).toFixed(2)}` : 'N/A';
    }

    function confirmBooking() {
      if (!hotel || !room || !checkin || !checkout || !localStorage.getItem('price')) {
        document.getElementById('warning').style.display = 'block';
        return;
      }
      document.getElementById('warning').style.display = 'none';
      window.location.href = '/payment.html';
    }
  </script>
</body>
</html>
