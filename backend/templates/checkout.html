<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout - Hotel Booking</title>
  <style>
    :root {
      --bg: #07111f;
      --panel: rgba(7, 17, 31, 0.84);
      --text: #f7f4ef;
      --muted: #c7d2e0;
      --accent: #ffb84d;
      --accent-2: #d65b5b;
      --border: rgba(255,255,255,0.16);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: linear-gradient(135deg, rgba(7,17,31,0.92), rgba(17,36,71,0.82)), url('/static/homepage.jpg') center/cover fixed;
    }

    .checkout-card {
      width: min(700px, 100%);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 18px 45px rgba(0,0,0,0.25);
      backdrop-filter: blur(12px);
    }

    h1 { margin: 0 0 14px; font-size: clamp(1.8rem, 3vw, 2.3rem); }
    .subtext { color: var(--muted); margin-bottom: 16px; line-height: 1.6; }
    .summary-list { display: grid; gap: 10px; margin-top: 12px; }
    .summary-item {
      display: flex; justify-content: space-between; gap: 12px; padding: 12px 14px; border-radius: 14px;
      background: rgba(255,255,255,0.08);
    }

    .summary-item strong { color: #f8d9a1; }
    button {
      width: 100%; margin-top: 18px; border: none; border-radius: 12px; padding: 12px 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: white; cursor: pointer; font-weight: 700;
    }
    .warning { display: none; color: #ffb3b3; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="checkout-card">
    <h1>Booking summary</h1>
    <p class="subtext">Your selected room is almost ready. Review the details and confirm your stay.</p>

    <div class="summary-list">
      <div class="summary-item"><strong>Hotel</strong><span id="hotel">...</span></div>
      <div class="summary-item"><strong>Room</strong><span id="room">...</span></div>
      <div class="summary-item"><strong>Check-in</strong><span id="checkin">...</span></div>
      <div class="summary-item"><strong>Check-out</strong><span id="checkout">...</span></div>
      <div class="summary-item"><strong>Total</strong><span id="price">...</span></div>
    </div>

    <button onclick="confirmBooking()">Confirm Booking</button>
    <div id="warning" class="warning">Some booking details are missing. Please complete the process.</div>
  </div>

  <script>
    const hotel = localStorage.getItem('selectedHotel');
    const room = localStorage.getItem('selectedRoom');
    const checkin = localStorage.getItem('checkinDate');
    const checkout = localStorage.getItem('checkoutDate');
    const price = localStorage.getItem('price');
    const userID = localStorage.getItem('userID');

    document.getElementById('hotel').textContent = hotel || 'N/A';
    document.getElementById('room').textContent = room || 'N/A';
    document.getElementById('checkin').textContent = checkin || 'N/A';
    document.getElementById('checkout').textContent = checkout || 'N/A';
    document.getElementById('price').textContent = price ? '₹' + price : 'N/A';

    function confirmBooking() {
      if (!hotel || !room || !checkin || !checkout || !price) {
        document.getElementById('warning').style.display = 'block';
        return;
      }
      document.getElementById('warning').style.display = 'none';

      const bookingData = {
        hotel: hotel,
        room_type: room,
        check_in: checkin,
        check_out: checkout,
        price: price,
        user_id: userID
      };

      fetch('/reserve', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(bookingData)
      })
      .then(res => res.json())
      .then(data => {
        alert(data.message || 'Booking Confirmed!');
        localStorage.clear();
        window.location.href = '/catalog';
      })
      .catch(err => {
        alert('Error confirming booking. Please try again.');
        console.error(err);
      });
    }
  </script>
</body>
</html>
