<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Checkout - Hotel Booking</title>
  <style>
    body {
      margin: 0;
      background-image: url('homepage.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: #f0f0f0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75);
      z-index: -1;
    }

    .checkout-container {
      background: linear-gradient(145deg, #1e1e1e, #2c2c2c);
      opacity: 0.8;
      transition: opacity 0.3s ease-in-out;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      max-width: 600px;
      width: 100%;
      text-align: center;
      margin-bottom: 40px;
    }

    h1 {
      margin-bottom: 30px;
      font-size: 2em;
      text-align: center;
      color: #ffffff;
    }

    p {
      font-size: 1.3em;
      margin: 15px 0;
      border-bottom: 1px solid #333;
      padding-bottom: 8px;
    }

    span {
      color: #90caf9;
    }

    button {
      width: 100%;
      padding: 15px;
      background-color: #1e88e5;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1em;
      margin-top: 30px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      background-color: #1565c0;
      transform: scale(1.03);
    }

    button:active {
      transform: scale(0.98);
    }

    .warning {
      color: #ff5252;
      font-size: 0.95em;
      text-align: center;
      margin-top: 20px;
      display: none;
    }

    h2 {
      margin-top: 40px;
      margin-bottom: 15px;
      color: #ffffff;
    }

    ul#reservation-list {
      max-width: 600px;
      width: 100%;
      list-style-type: none;
      padding: 0;
      color: #ddd;
    }

    ul#reservation-list li {
      background: #2a2a2a;
      padding: 12px 20px;
      margin-bottom: 10px;
      border-radius: 8px;
      font-size: 1.1em;
    }
  </style>
</head>
<body>

  <div class="checkout-container">
    <h1>🧾 Booking Summary</h1>

    <p><strong>Hotel:</strong> <span id="hotel">...</span></p>
    <p><strong>Room Number:</strong> <span id="room">...</span></p>
    <p><strong>Check-In:</strong> <span id="checkin">...</span></p>
    <p><strong>Check-Out:</strong> <span id="checkout">...</span></p>
    <p><strong>Total Price:</strong> <span id="price">...</span></p>

    <button onclick="confirmBooking()">Confirm Booking</button>

    <div id="warning" class="warning">
      Some booking details are missing. Please complete the process.
    </div>
  </div>


  <script>
    const hotel = localStorage.getItem("selectedHotel");
    const room = localStorage.getItem("selectedRoom");
    const checkin = localStorage.getItem("checkinDate");
    const checkout = localStorage.getItem("checkoutDate");
    const price = localStorage.getItem("price");
    const userID = localStorage.getItem("userID");

    // Display booking summary
    document.getElementById("hotel").textContent = hotel || "N/A";
    document.getElementById("room").textContent = room || "N/A";
    document.getElementById("checkin").textContent = checkin || "N/A";
    document.getElementById("checkout").textContent = checkout || "N/A";
    document.getElementById("price").textContent = price ? "₹" + price : "N/A";

    function confirmBooking() {
      if (!hotel || !room || !checkin || !checkout || !price) {
        document.getElementById("warning").style.display = "block";
        return;
      }
      document.getElementById("warning").style.display = "none";

      // Prepare booking data
      const bookingData = {
        hotel: hotel,
        room_type: room,
        check_in: checkin,
        check_out: checkout,
        price: price,
		user_id: userID
      };

      // Send booking to Flask backend
      fetch("http://localhost:5000/reserve", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(bookingData)
      })
      .then(res => res.json())
      .then(data => {
        alert(data.message || "Booking Confirmed!");
        localStorage.clear();
        window.location.href = "catalog.html";
      })
      .catch(err => {
        alert("Error confirming booking. Please try again.");
        console.error(err);
      });
    }

</body>
</html>
