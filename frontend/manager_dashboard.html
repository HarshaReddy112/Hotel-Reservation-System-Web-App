<!DOCTYPE html>
<html>
<head>
  <title>Manager Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
  font-family: Arial;
  margin: 0;
  background-image: url("bluebg.jpg");
  background-size: cover;      /* Stretch image to fill screen */
  background-position: center; /* Center the image */
  background-attachment: fixed; /* Image stays fixed when scrolling */
}

    header { background: #34495e; padding: 15px; color: white; text-align: center; font-size: 22px; }
    
    .kpi-container {
      display: flex;
      justify-content: space-around;
      margin: 20px;
      gap: 15px;
    }
    .kpi {
      background: white;
      padding: 12px;
      flex: 1;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    .kpi h2 { margin: 5px 0; font-size: 26px; color: #2c3e50; }
    .kpi p { margin: 0; font-size: 14px; color: #555; }

    .charts {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;   /* 3 equal columns */
  gap: 20px;
  margin: 20px;
  padding-bottom: 20px;
}
.chart-box canvas {
  height: 260px !important;   /* fix equal chart height */
}

    .chart-box {
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
	@media (max-width: 900px) {
  .charts {
    grid-template-columns: 1fr; /* stack charts vertically on small screens */
  }
}

  </style>
</head>
<body>

<header>📊 Manager Analytics Dashboard</header>

<div class="kpi-container">
  <div class="kpi"><h2 id="rev">₹0</h2><p>Total Revenue</p></div>
  <div class="kpi"><h2 id="bookings">0</h2><p>Total Bookings</p></div>
  <div class="kpi"><h2 id="avg">0</h2><p>Avg Stay (days)</p></div>
</div>

<div class="charts">
  <div class="chart-box">
    <canvas id="revenueChart"></canvas>
  </div>
  <div class="chart-box">
    <canvas id="bookingsChart"></canvas>
  </div>
  <div class="chart-box">
    <canvas id="roomChart"></canvas>
    <div id="roomLegend" style="margin-top: 10px; text-align: center;"></div>
  </div>
</div>

<script>
fetch("http://localhost:5000/analytics/dashboard")
  .then(res => res.json())
  .then(data => {

    document.getElementById("rev").textContent = "₹" + data.total_revenue;
    document.getElementById("bookings").textContent = data.total_bookings;
    document.getElementById("avg").textContent = data.avg_stay;

    const revLabels = data.revenue.map(r => r.date);
    const revValues = data.revenue.map(r => r.price);
    new Chart(document.getElementById("revenueChart"), {
      type: "bar",
      data: { labels: revLabels, datasets: [{ label: "Revenue Per Day (₹)", data: revValues }] }
    });

    const bookLabels = data.bookings.map(b => b.date);
    const bookValues = data.bookings.map(b => b.rooms_booked);
    new Chart(document.getElementById("bookingsChart"), {
      type: "line",
      data: { labels: bookLabels, datasets: [{ label: "Bookings Per Day", data: bookValues }] }
    });

    // Pie chart — uses room_type (not room_category)
    const roomLabels = data.room_dist.map(r => r.room_type);
    const roomValues = data.room_dist.map(r => r.count);
    const roomChart = new Chart(document.getElementById("roomChart"), {
      type: "pie",
      data: {
        labels: roomLabels,
        datasets: [{
          data: roomValues,
          backgroundColor: ["#3498db", "#e67e22", "#9b59b6", "#2ecc71", "#e74c3c", "#1abc9c"]
        }]
      },
      options: { plugins: { legend: { display: false } } }
    });

    const colors = roomChart.data.datasets[0].backgroundColor;
    let legendHTML = "";
    roomLabels.forEach((label, i) => {
      legendHTML += `
        <span style="display:inline-block; margin: 4px 10px;">
          <span style="display:inline-block; width:12px; height:12px; 
            background:${colors[i]}; border-radius:3px; margin-right:6px;">
          </span> ${label}
        </span>`;
    });
    document.getElementById("roomLegend").innerHTML = legendHTML;

  })
  .catch(err => console.error(err));
</script>

</body>
</html>
